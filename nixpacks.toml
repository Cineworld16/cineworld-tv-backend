providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_24"]
# libs de sistema que o Chromium do Playwright precisa (via apt = paths padrao /usr/lib)
aptPkgs = [
  "libglib2.0-0", "libnss3", "libnspr4", "libatk1.0-0", "libatk-bridge2.0-0",
  "libcups2", "libdrm2", "libdbus-1-3", "libatspi2.0-0", "libx11-6",
  "libxcomposite1", "libxdamage1", "libxext6", "libxfixes3", "libxrandr2",
  "libgbm1", "libxcb1", "libxkbcommon0", "libpango-1.0-0", "libcairo2",
  "libasound2t64"
]

[phases.install]
cmds = ["npm ci --include=dev", "npx playwright install chromium"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
